services:
  sentinel-gateway:
    build: .
    container_name: sentinel-llm-gateway
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SENTINEL_HOST=0.0.0.0
      - SENTINEL_PORT=8000
      - SENTINEL_PROVIDER=${SENTINEL_PROVIDER:-local-demo}
      - SENTINEL_DB_PATH=/app/data/sentinel_gateway.db
    volumes:
      - sentinel_data:/app/data
    restart: unless-stopped

volumes:
  sentinel_data:
