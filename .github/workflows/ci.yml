name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests eval

      - name: Run unit and API integration tests
        run: pytest -v

      - name: Run guardrail, PII, and semantic cache benchmarks
        run: python eval/run_eval.py

      - name: Verify packaged UI asset and app startup smoke check
        run: |
          python -c "
          from pathlib import Path
          import sentinel_gateway
          from fastapi.testclient import TestClient
          from sentinel_gateway.api import create_app
          from sentinel_gateway.config import Settings
          ui = Path(sentinel_gateway.__file__).parent / 'static' / 'index.html'
          assert ui.is_file(), f'Missing packaged static asset: {ui}'
          with TestClient(create_app(Settings(db_path='/tmp/ci_smoke.db'))) as client:
              assert client.get('/').status_code == 200
              assert client.get('/health').json()['status'] == 'ok'
          "
